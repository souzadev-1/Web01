<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funil de métricas — visualização simplificada</title>
  <style>
body{font-family:Segoe UI,sans-serif;padding:20px;background:#f8fafc;color:#0f172a}h2{font-size:1.1rem;color:#0284c7;margin-bottom:14px;text-align:center}.funil{display:flex;flex-direction:column;gap:6px}.etapa{background:#fff;border-radius:8px;padding:2px;cursor:pointer;transition:.2s}.etapa:hover{transform:scale(1.01)}.barra{color:#fff;padding:12px 16px;border-radius:6px;font-weight:bold;font-size:.84rem;transition:width .4s}.info{background:#e0f2fe;border-left:3px solid #0284c7;padding:10px 14px;border-radius:6px;margin-top:14px;font-size:.8rem;color:#0369a1;font-weight:600}
  </style>
</head>
<body>
<h2>📊 Funil de Métricas — exemplo</h2><div class="funil"><div class="etapa" data-taxa="100%"><div class="barra" style="width:100%;background:#0284c7"><span>1. Visita • 100%</span></div></div><div class="etapa" data-taxa="30%"><div class="barra" style="width:70%;background:#0891b2"><span>2. Interesse • 30%</span></div></div><div class="etapa" data-taxa="12%"><div class="barra" style="width:40%;background:#0d9488"><span>3. Decisão • 12%</span></div></div><div class="etapa" data-taxa="6%"><div class="barra" style="width:20%;background:#059669"><span>4. Compra • 6%</span></div></div></div><div id="info" class="info">Clique em qualquer barra para ver a taxa de conversão até a etapa anterior.</div>
  <script>
document.querySelectorAll(".etapa").forEach(function(el){el.addEventListener("click",function(){var t=el.dataset.taxa;document.getElementById("info").textContent="Etapa com taxa de "+t+" dos visitantes que chegaram até aqui.";});});
  </script>
</body>
</html>
